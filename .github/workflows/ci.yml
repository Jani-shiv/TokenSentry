# GitHub Actions cache for pip
# This workflow caches pip packages to speed up CI runs

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          cache-restore-keys: |
            ${{ runner.os }}-pip-
      
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src --ignore-missing-imports --disable-error-code=import-not-found
      - run: pytest

  # Dependency review
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          config-file: '.github/dependency-review-config.yml'