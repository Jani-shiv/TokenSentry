[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tokensentry"
version = "0.1.0"
description = "Local-first prompt analysis, optimization, and validation toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "TokenSentry contributors" }]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<15",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]
openai-tokenizer = ["tiktoken>=0.7"]
huggingface-tokenizer = ["tokenizers>=0.19"]
sentencepiece = ["sentencepiece>=0.2"]

[project.scripts]
tokensentry = "tokensentry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tokensentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
