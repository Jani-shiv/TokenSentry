[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tokensentry"
version = "0.1.1"
description = "Local-first prompt analysis, optimization, and validation toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "TokenSentry contributors" }]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<16",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]
openai-tokenizer = ["tiktoken>=0.7"]
huggingface-tokenizer = ["tokenizers>=0.19"]
sentencepiece = ["sentencepiece>=0.2"]

[project.scripts]
tokensentry = "tokensentry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tokensentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
# Ignore missing imports for optional dependencies
ignore_missing_imports = true
# Disable error codes that are too noisy for this codebase
disable_error_code = [
    "import-not-found",
    "no-untyped-def",
    "no-untyped-call",
    "no-any-return",
    "unused-ignore",
    "assignment",
    "var-annotated",
    "attr-defined",
    "arg-type",
    "union-attr",
    "misc",
    "type-arg",
    "dict-item",
    "override",
    "index",
]
# Per-module overrides for problematic files
[[tool.mypy.overrides]]
module = [
    "tokensentry.tokenizers.*",
    "tokensentry.skills.*",
    "tokensentry.validation.*",
    "tokensentry.benchmarks.*",
    "tokensentry.reports.*",
    "tokensentry.reports.*",
]
ignore_missing_imports = true
disable_error_code = [
    "import-not-found",
    "no-untyped-def",
    "no-untyped-call",
    "no-any-return",
    "attr-defined",
    "arg-type",
    "union-attr",
    "misc",
    "type-arg",
    "no-untyped-def",
]
